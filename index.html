 if(!els.length)return;
 var fill={};
 if(MAPMODE!=='chg')OLD.forEach(function(n){fill[n]=CO});
 if(MAPMODE!=='old')NEWC.forEach(function(n){fill[n]=CN});
 var bs=document.querySelectorAll('.mb');for(var j=0;j<bs.length;j++){bs[j].className='mb'+(bs[j].getAttribute('data-m')===MAPMODE?' on':'')}
 var mk=[{name:'① 부산',lon:129.08,lat:35.1},{name:'② 지중해 동쪽',lon:33,lat:34.5},{name:'③ 호주 동쪽',lon:152,lat:-33},{name:'④ 미국 북동부',lon:-69,lat:42},{name:'⑤ 대보초',lon:147,lat:-18}].concat(eqMarkers());
 for(var i=0;i<els.length;i++){
  try{
   if(!window.WQV||!WQV.worldMap){setTimeout(drawMaps,400);return}
   els[i].innerHTML='';
   WQV.worldMap(els[i].id,{oceans:true,fill:fill,markers:mk});
  }catch(e){}
 }
}
function setMode(m){MAPMODE=m;drawMaps()}

function nav(){
 var h='';STEPS.forEach(function(s,i){h+='<button class="'+(i==S.step?'on ':'')+(S.done.indexOf(i)>=0?'done':'')+'" onclick="goto('+i+')">'+s.t+'</button>'});
 h+='<button onclick="goto(4)" class="'+(S.step==4?'on':'')+'">📋 모아 보기</button>';
 document.getElementById('nav').innerHTML=h}
function goto(i){if(i<4&&S.done.indexOf(S.step)<0&&S.step<4)S.done.push(S.step);S.step=i;save();render();window.scrollTo(0,0)}
function bind(id,fn){var e=document.getElementById(id);if(e)e.oninput=function(){fn(this.value);save()}}

function render(){
 nav();var v=document.getElementById('view'),h='';
 if(S.step==0){
  h+='<div class="card"><h2>부캉이는 누구?</h2><p>부산 바다에서 따뜻한 바다에 사는 흑상어가 발견되었어요. 우리는 이 흑상어를 <b>부캉이</b>라고 불러요.</p><p><b>친구와 이야기해요:</b> 부캉이는 왜 부산까지 왔을까요?</p></div>';
  h+='<div class="card"><h2>친구와 함께 쓰는 가설 칸</h2>'+pairLine()+'<textarea id="h1" placeholder="둘이 이야기한 내용을 함께 적어요">'+esc(S.h1)+'</textarea><div class="saved" id="sv"></div></div>';
 }
 if(S.step==1){
  h+='<div class="card"><h2>부캉이는 어떻게?</h2><p>자료 1~4를 차례로 읽어요. 각 자료에서 알게 된 점을 적으면, <b>부캉이가 어떻게 부산까지 왔는지</b> 알 수 있어요.</p>'+pairLine()+'<div class="chain"><span>지구 온도 상승</span><b>→</b><span>바닷물 수온 상승</span><b>→</b><span>따뜻한 바다 물고기·먹이의 북상</span><b>→</b><span>부산에서 부캉이 발견</span></div>'+siteGuide()+'</div>';
  EVID.forEach(function(e){
   h+='<div class="card"><h2>'+e.t+'</h2><div class="evi">';
   e.p.forEach(function(x){h+='<p>'+x+'</p>'});
   h+='</div>'+(e.map?mapCard('map_'+e.id):'')+siteCards(e.s);
   h+='<label>🧐 '+e.q+'</label><textarea id="ev_'+e.id+'" placeholder="자료에서 알게 된 점을 적어요">'+esc(S.ev[e.id])+'</textarea></div>'});
  h+='<div class="card"><h2>자료를 모아 이유 알아내기</h2><div class="frame">📌 부캉이는 누구? 에서 우리가 쓴 생각: <b>'+(S.h1?esc(S.h1):'(아직 쓰지 않았어요)')+'</b></div>';
  h+='<label>자료를 보니 부캉이는 이래서 부산까지 왔구나!</label><textarea id="fin">'+esc(S.fin)+'</textarea>';
  h+='<label>처음 생각과 자료를 본 뒤의 생각을 비교해 봐요</label><textarea id="cmp">'+esc(S.cmp)+'</textarea><div class="saved" id="sv"></div></div>';
 }
 if(S.step==2){
  var A=AREAS[S.area],d=S.areas[A.id];
  h+='<div class="card"><h2>부캉이는 왜?</h2><p>부캉이가 온 것은 지구온난화 때문이에요. 지구온난화로 나타나는 변화를 영역별로 찾아 칸을 채워요.</p><div class="book">📖 교과서 180~181쪽을 참고하여 작성해요.</div>'+pairLine()+'</div>';
  h+='<div class="tabs">';AREAS.forEach(function(a,i){var ok=S.areas[a.id].x&&S.areas[a.id].y;h+='<button class="'+(i==S.area?'on':'')+'" onclick="area('+i+')">'+a.n+(ok?' ✓':'')+'</button>'});h+='</div>';
  h+='<div class="card"><h2>'+A.n+'</h2><div class="book">📖 교과서 180~181쪽을 참고하여 작성해요.</div>';
  h+='<label>① 어떤 일이 일어나고 있나요?</label><textarea id="ax">'+esc(d.x)+'</textarea>';
  h+='<label>② 어떤 피해가 발생하나요?</label><textarea id="ay">'+esc(d.y)+'</textarea><div class="saved" id="sv"></div></div>';
  h+='<div class="card"><h2>더 알아보고 싶다면 (참고)</h2><div>검색어: '+chips(A.kw)+'</div>'+(A.map?mapCard('map_'+A.id):'')+siteGuide()+siteCards(A.s)+'</div>';
 }
 if(S.step==3){
  h+='<div class="card"><h2>정리</h2>'+pairLine()+'<label>부캉이는 왜 부산에 나타났나?</label><textarea id="why">'+esc(S.why)+'</textarea>';
  h+='<label>지구온난화에 도움이 되기 위한 나의 행동 한 가지</label><textarea id="pledge">'+esc(S.pledge)+'</textarea><div class="saved" id="sv"></div></div>';
 }
 if(S.step==4){
  h+='<div class="card"><h2>📋 우리 활동 모아 보기</h2><label>이름 (친구 두 명)</label><input type="text" id="names" value="'+esc(S.names)+'" placeholder="예: 3학년 2반 김○○, 이○○"><p>복사해서 선생님께 제출하거나, PDF로 저장해서 내요.</p><button class="big" onclick="copyAll()">📄 전체 내용 복사하기</button> <button class="big" style="background:#2f6fb0" onclick="savePdf()">⬇️ PDF로 저장하기</button> <span id="cp"></span><pre id="all">'+esc(allText())+'</pre></div>';
 }
 if(S.step<4){h+='<div class="go"><button class="gray" onclick="goto('+Math.max(0,S.step-1)+')"'+(S.step==0?' style="visibility:hidden"':'')+'>← 이전</button><button onclick="goto('+(S.step+1)+')">'+(S.step==3?'모아 보기 →':'다음 →')+'</button></div>'}
 v.innerHTML=h;
 drawMaps();
 bind('h1',function(x){S.h1=x});bind('fin',function(x){S.fin=x});bind('cmp',function(x){S.cmp=x});bind('why',function(x){S.why=x});bind('pledge',function(x){S.pledge=x});bind('names',function(x){S.names=x});
 if(S.step==1)EVID.forEach(function(e){bind('ev_'+e.id,function(x){S.ev[e.id]=x})});
 if(S.step==2){var id=AREAS[S.area].id;bind('ax',function(x){S.areas[id].x=x});bind('ay',function(x){S.areas[id].y=x})}
}
function area(i){S.area=i;save();render()}
function allText(){
 var L=['이름: '+(S.names||''),'','■ 부캉이는 누구? (친구와 쓴 가설)',S.h1||'(미작성)','','■ 부캉이는 어떻게? (자료를 보고 알아낸 것)'];
 EVID.forEach(function(e){L.push('- '+e.t+' → '+(S.ev[e.id]||''))});
 L.push('부캉이가 온 이유: '+(S.fin||''),'처음 생각과 비교: '+(S.cmp||''),'','■ 부캉이는 왜? (교과서 180~181쪽)');
 AREAS.forEach(function(a){var d=S.areas[a.id];L.push('['+a.n+']','① 어떤 일이 일어나고 있나요?: '+d.x,'② 어떤 피해가 발생하나요?: '+d.y)});
 L.push('','■ 정리','부캉이는 왜 부산에 나타났나?: '+(S.why||''),'지구온난화에 도움이 되기 위한 나의 행동 한 가지: '+(S.pledge||''));
 return L.join('\n')}
function copyAll(){
 var t='[부캉이의 여행 알아보기]\n'+allText(),ok=function(){document.getElementById('cp').textContent='복사됐어요!'};
 try{navigator.clipboard.writeText(t).then(ok,function(){sel()})}catch(e){sel()}
 function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('all'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('cp').textContent='글이 선택됐어요. 길게 눌러 복사해요.'}}
function savePdf(){
 var p=document.getElementById('printArea');
 p.innerHTML='<h1>부캉이의 여행 알아보기</h1><pre>'+esc(allText())+'</pre>';
 document.body.classList.add('printing');
 var done=function(){document.body.classList.remove('printing')};
 window.onafterprint=done;
 try{window.print()}catch(e){done();document.getElementById('cp').textContent='이 화면에서는 인쇄가 막혀 있어요. .html 파일로 받아 크롬에서 열어 주세요.'}
 setTimeout(function(){if(document.body.classList.contains('printing'))done()},60000)}
render();
</script>
</body>
</html>
